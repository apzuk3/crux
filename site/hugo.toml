baseURL = "https://crux.foo/"
title = "crux"
locale = "en-US"
enableRobotsTXT = true
enableEmoji = true

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "../docs"
    target = "content/docs"
    files = ["! README.md"]
  [[module.mounts]]
    source = "../docs/README.md"
    target = "content/docs/_index.md"

[markup.goldmark.renderer]
  unsafe = true
[markup.goldmark.extensions]
  footnote = true
  taskList = true
[markup.goldmark.renderHooks.link]
  useEmbedded = "fallback"
[markup.highlight]
  noClasses = false

[outputs]
  home = ["html", "llms"]
  section = ["html", "markdown"]
  page = ["html", "markdown"]

[params]
  description = "A small Go toolkit for building LLM agents that run the same way on every major provider."
  externalLinkDecoration = true
  displayUpdatedDate = false

  [params.navbar]
    displayTitle = true
    displayLogo = false

  [params.page]
    width = "wide"
    [params.page.contextMenu]
      enable = true
      [[params.page.contextMenu.links]]
        name = "Open in Claude"
        icon = "claude"
        url = "https://claude.ai/new?q=I%27m+using+crux+%28crux.foo%29.+Read+this+page+and+help+me+with+it%3A+{url}"
      [[params.page.contextMenu.links]]
        name = "Open in ChatGPT"
        icon = "chatgpt"
        url = "https://chatgpt.com/?hints=search&q=I%27m+using+crux+%28crux.foo%29.+Read+this+page+and+help+me+with+it%3A+{url}"

  [params.highlight.copy]
    enable = true
    display = "hover"

  [params.theme]
    default = "system"
    displayToggle = true

  [params.footer]
    displayCopyright = false
    displayPoweredBy = false
    width = "normal"

  [params.search]
    enable = true
    type = "flexsearch"
    maxResults = 10

  [params.editPage]
    enable = true
    base = "https://github.com/apzuk3/crux/edit/main"

[[menu.main]]
  name = "Docs"
  pageRef = "/docs"
  weight = 10
[[menu.main]]
  name = "Examples"
  url = "https://github.com/apzuk3/crux/tree/main/examples"
  weight = 20
[[menu.main]]
  name = "API"
  url = "https://pkg.go.dev/crux.foo"
  weight = 30
[[menu.main]]
  name = "Search"
  weight = 40
  [menu.main.params]
    type = "search"
[[menu.main]]
  name = "GitHub"
  url = "https://github.com/apzuk3/crux"
  weight = 50
  [menu.main.params]
    icon = "github"
