name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26", "stable"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          go vet -tags evals ./evals/...

      - name: go test
        if: runner.os != 'Windows'
        run: go test -race ./...

      # -race needs cgo, which the Windows runners don't set up.
      - name: go test (Windows)
        if: runner.os == 'Windows'
        run: go test ./...

      - name: Core works without cgo
        env:
          CGO_ENABLED: "0"
        run: |
          go test . ./cruxtest/...
          if go list -deps . | grep -qE 'mattn/go-sqlite3|sqlite'; then
            echo "the crux package must not depend on a SQLite driver"; exit 1
          fi
